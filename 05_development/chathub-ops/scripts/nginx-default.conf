# 稼働中サービスのみを載せた構成。
#
# nginx は起動時に upstream を名前解決するため、未起動コンテナを参照する location が
# あると nginx 自体が起動できない（host not found in upstream）。配布元の
# infra/nginx-default.conf は全ブリッジ稼働前提なので、そのままでは起動しない。
#
# ブリッジを追加したら infra/nginx-default.conf から該当 location を戻すこと。
# その際 Authorization は配布時に <REDACTED> へ伏せられているので、各ブリッジの
# config.yaml の provisioning.shared_secret を入れ直す必要がある。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Matrix のメディアアップロードが 1MB 既定に当たるため引き上げる。
  client_max_body_size 50M;

  location / { try_files $uri /index.html; }

  # index.html と sw.js は絶対にキャッシュさせない。付けないと Chromium が
  # ヒューリスティックにキャッシュし、デスクトップアプリが古いビルドの
  # index.html を掴んだまま新しい assets を読み込まない。
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  # assets/ はファイル名にハッシュが入るので永久キャッシュで良い。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Matrix を UI と同一オリジンで出す。Tailscale Serve が 443 をこの nginx へ
  # 向けるので、クライアントは https://winnaru.tailac157e.ts.net だけで完結し、
  # CORS もポート開放も不要になる。
  location /_matrix/ {
    proxy_pass http://synapse:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /_synapse/client/ {
    proxy_pass http://synapse:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # server_name は chathub.naru.internal だが実際の接続先は Tailscale のホスト名。
  # well-known を返しておくと、クライアントが base_url を自力で見つけられる。
  location = /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    return 200 '{"m.homeserver":{"base_url":"https://winnaru.tailac157e.ts.net"}}';
  }

  location /links/ {
    proxy_pass http://bridge-links:29360/;
    proxy_read_timeout 30s;
  }
}
