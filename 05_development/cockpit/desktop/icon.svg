<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
  </defs>

  <!-- 角丸の本体。macOS の squircle に寄せた半径 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="#3c424c" stroke-width="12"/>

  <!-- 左ペイン: 案件の列。上2本は要対応(琥珀)、下は静穏 -->
  <g>
    <rect x="150" y="250" width="196" height="54" rx="16" fill="#e0a53c"/>
    <rect x="150" y="336" width="196" height="54" rx="16" fill="#e0a53c" opacity="0.62"/>
    <rect x="150" y="422" width="196" height="54" rx="16" fill="#5b636f"/>
    <rect x="150" y="508" width="196" height="54" rx="16" fill="#5b636f" opacity="0.72"/>
    <rect x="150" y="594" width="196" height="54" rx="16" fill="#5b636f" opacity="0.5"/>
    <rect x="150" y="680" width="196" height="54" rx="16" fill="#5b636f" opacity="0.32"/>
  </g>

  <!-- 右: ターミナル。プロンプト記号とカーソル -->
  <rect x="410" y="250" width="464" height="484" rx="34" fill="#0d0f12" stroke="#3c424c" stroke-width="10"/>
  <path d="M486 372 L546 424 L486 476" fill="none" stroke="#6fcf97" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="580" y="404" width="124" height="34" rx="12" fill="#6fcf97" opacity="0.85"/>
  <rect x="486" y="540" width="218" height="26" rx="10" fill="#4b535e"/>
  <rect x="486" y="606" width="150" height="26" rx="10" fill="#4b535e" opacity="0.6"/>
</svg>
