  - article [ref=e5]:
    - heading "クロア、創業15周年で新たな癒やしの映像事業を発表！高画質ドローン動画でリラックス空間を提供。" [level=2] [ref=e6]
    - list [ref=e8]:
      - listitem [ref=e9]: 投稿日：2024年09月24日
    - paragraph [ref=e10]: ウェルビーイング・テクノロジー事業を行なう株式会社クロアは、創業15周年を迎え、最新の高画質ドローン技術を活用した新たな映像事業を発表しました。新事業は、ヒーリングミュージックと高画質映像の融合により、視聴者に深いリラックスと癒やしを提供致します。特に、ストレス軽減や集中力向上を目指した機能性を持つこの映像は、オフィスやプライベート空間での利用に最適です。RELAX WORLDの公式YouTubeチャンネルでの配信を開始し、現代社会で求められるウェルビーイング体験をお届けします。
    - paragraph [ref=e11]:
      - strong [ref=e12]: 同時に、新たなクロアのパーパス（存在意義）も公表いたしました。
    - paragraph [ref=e13]:
      - strong [ref=e14]: A Harmony of Sleep, Healing, and Eastern Wisdom
      - strong [ref=e15]: 眠りと癒やし、東洋の知恵の調和
    - paragraph [ref=e16]
    - paragraph [ref=e17]
    - paragraph [ref=e18]: 私たちの音源制作事業と映像制作事業は、機能性を最優先し、専門家の監修や科学的エビデンスに基づく多角的な知見を取り入れています。この取り組みは、東洋の知恵と現代の技術の調和を通じて、心と身体のバランスを整えることを目指し、ウェルビーイング・テクノロジー事業のさらなる発展を推進します。
    - paragraph [ref=e19]: 詳しくは下記よりご覧ください。
