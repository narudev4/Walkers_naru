        - generic [ref=e22]: （お知らせ）
      - heading "耳から取り入れる健康法。日々の様々なシーンに寄り添う癒やしと眠りの音楽アプリ「RELAX WORLD MUSIC」がより使いやすくリニューアル。" [level=1] [ref=e23]
      - generic [ref=e24]:
        - paragraph [ref=e25]:
          - strong [ref=e26]: ウェルビーイング・テクノロジー事業から生まれた実績に基づき制作された話題のソルフェジオ周波数、医学博士・専門家監修作品をはじめ、カフェミュージック、作業用・集中BGM、自然音など様々なBGMを提供。
        - paragraph [ref=e27]:
          - text: ”瞑想と眠り”をスローガンとしている株式会社クロア (本社：東京都目黒区、代表取締役社長：戸部田 馬準)は、生活に寄り添う音楽をシンプルな操作性でお届けする⾳楽アプリ「RELAX WORLD MUSIC」を2024年5月28日にリニューアル配信いたしました。
          - link [ref=e28] [cursor=pointer]:
            - /url: http://stg.croix.asia/wp-content/uploads/2026/03/PressRelease_main.png
        - paragraph [ref=e29]: ウェルビーイング・テクノロジー事業を行う株式会社クロア (本社：東京都目黒区、代表取締役社長：戸部田 馬準)は、生活に寄り添う音楽をシンプルな操作性でお届けする⾳楽アプリ「RELAX WORLD MUSIC」をさらに使いやすくリニューアルし2024年5月28日に配信開始いたしました。
        - paragraph [ref=e30]: 健康志向が幅広い世代で高まる一方で健康被害やトラブルのニュースは後を絶ちません。またSNS等の利用に起因する現代社会ならではのストレスや不規則な生活サイクルにより生じる様々な悩みを持つ方も増えています。
        - paragraph [ref=e31]: 癒やしと眠りの音楽アプリ「RELAX WORLD MUSIC」が提供させて頂くのは、日々の様々なシーンに寄り添う音楽です。
        - paragraph [ref=e32]: 聴いた時に心地良さを感じ、心身に良い効果があると言われているソルフェジオ周波数や、医学博士・専門家監修作品をはじめ、カフェミュージック、作業用・集中BGM、オルゴール、自然音など様々なBGMをご提供。音楽がもたらす様々な効果が活動と休息にメリハリをつけ、一日を締めくくる大切な睡眠がより良質なものになることが期待されます。
        - paragraph [ref=e33]: 無料プランも選べる「RELAX WORLD MUSIC」アプリは気軽な気分転換にも活用頂けるほか、 有料プランでは新機能「今日の瞑想時間」やクロアが制作・レコメンドする最新音楽などがご利用頂けます。“耳から取り入れる健康法”として様々なBGMで癒やしと眠りのお手伝いをさせて頂きます。
        - paragraph [ref=e34]
        - heading "●アプリの持つ４つの特徴" [level=3] [ref=e35]:
          - strong [ref=e36]: ●アプリの持つ４つの特徴
        - paragraph [ref=e37]:
          - strong [ref=e38]: (1) 暮らしのシーンごとに最適なBGMを提供！
          - link [ref=e39] [cursor=pointer]:
            - /url: http://stg.croix.asia/wp-content/uploads/2026/03/d14064b64032ed65b500667997b9866d.png
          - text: 「お目覚め」「ヨガ」「自然音」「作業・集中BGM」など、時間帯やシーン別に最適なコンテンツをご用意し、一日の健康とリラクゼーション体験をトータルでサポートします。
          - text: 仕事・ウォーキングなどの活動時には、パフォーマンス向上に効果的な音楽をお選びいただけます。一方、休憩や睡眠前など心身を休めたい時には、副交感神経優位をうながす癒やしの音楽が効果的です。
          - text: シーンごとに最適の音楽を使い分けていただくことで、生活リズムにメリハリが生まれ、睡眠の質の向上につながります。
          - text: 「ドライブ」「スパ」「ピアノ」「ソルフェジオ周波数」「α波音楽」「読み聞かせ」など、様々な趣味やライフスタイルに寄り添う多彩なプレイリストをご用意しております。
          - strong [ref=e40]: (2) 背景音をカスタムし、「1/fゆらぎ」を体感
          - link [ref=e41] [cursor=pointer]:
            - /url: http://stg.croix.asia/wp-content/uploads/2026/03/db36eb4047c8feedeac890499723e6b3.png
          - text: 川のせせらぎや森の音、ホワイトノイズなど、耳にやさしい環境音を自在にMIXし、あなただけの音を作成できます。
          - text: 自然界の様々な音には、リラクゼーション効果を持つといわれる「1/fゆらぎ」が含まれています。お好みの音楽に自然音を重ねていただくことで、さらなる癒やしの効果が期待できます。
          - strong [ref=e42]: (3) 季節に合った期間限定音源や新規音源も毎月順次配信
          - text: 定番コンテンツのほか、期間限定のシーズナルな音楽や新規音源も順次配信します。
          - strong [ref=e43]: (4) シンプルな操作性
          - text: より洗練されたインターフェイスで簡単操作。どこに何があるか一目でわかり、ストレスなく音楽を聴くことができます。
          - strong [ref=e44]: その他のこだわり
          - text: 新機能「今日の瞑想時間」が一目で分かるほか、スマホの機能と連携させれば「今日の睡眠時間」「今日の歩数」なども計測可能。
          - text: 再生時間をセットできるタイマー、ループ再生、お気に入り機能等のお休み時にも使いやすい便利機能も標準搭載。
          - strong [ref=e45]: 音楽のリラックス効果
          - text: アプリRELAX WORLD MUSICは、音楽の持つ癒やしの力に着目して開発されました。
          - text: 音楽は、人の意識と無意識の両方に作用することで、様々な良い影響をもたらします。こうした効果は医学界でも注目を集めており、音楽療法の分野で研究されています。
          - link [ref=e46] [cursor=pointer]:
            - /url: http://stg.croix.asia/wp-content/uploads/2026/03/47555fd42a214fc4090c16331f2d67c7.png
          - strong [ref=e47]: RELAX WORLD MUSICの音楽の効果
          - text: 音楽の癒やしの効果が注目されていますが、音楽なら何でも良いというわけではありません。
          - text: 当アプリを開発したCROIX（クロア）の楽曲を用いて実験をおこなったところ、音楽を聴いた人の脳内に、リラックスした状態を示唆する脳波の状態が観測されました。（※当社調べ）
        - paragraph [ref=e48]:
          - text: 人間の脳波には、α波、β波、γ波等があり、覚醒・緊張状態にあるとき、またいらいらしている時には、脳のβ波が優位になります。
          - text: CROIX（クロア）の音楽を聴く前と聴いている最中の脳波を測定したところ、CROIX（クロア）音楽を聴いている最中は脳内のβ波が減少するという結果が得られたのです。
          - text: このことから、RELAX WORLDの音楽をかけているあいだは、不安や緊張、いらいらが低減する効果が期待できます。
          - text: 詳しくはこちらのページのグラフもご覧ください。
          - link "https://relaxworld.jp/pages/relaxworldmusic-app" [ref=e49] [cursor=pointer]:
            - /url: https://relaxworld.jp/pages/relaxworldmusic-app
        - paragraph [ref=e50]:
          - link [ref=e51] [cursor=pointer]:
            - /url: http://stg.croix.asia/wp-content/uploads/2026/03/800636c4cf9e51cae2c30a8d5aa79e93.png
          - strong [ref=e52]: エビデンスと豊富な実績に基づく音楽アプリ
          - text: 人によって音楽の嗜好はさまざま。
          - text: CROIX（クロア）は長年「リラックス」を研究し、ヒーリング音楽を世界にリリースしてきた実績があります。
          - text: アプリRELAX WORLD MUSICは、医学博士や音楽療法士が監修した音源をはじめ、癒やしと眠りをもたらす様々な種類の音楽を提供し、あなたの一日をトータルでサポート。
          - text: 入眠時だけでなく、活動時間帯とのメリハリをつけて生活リズムに山と谷を作ることで、一日の終わりにおとずれる睡眠をより良質なものにします。
