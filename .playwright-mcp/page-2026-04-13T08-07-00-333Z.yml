      - paragraph [ref=e141]
      - heading "“音”と“香り”、どちらも本物。感性に寄り添う、ハイブリッド癒やし設計。" [level=3] [ref=e142]:
        - text: 
        - strong [ref=e143]: “音”と“香り”、どちらも本物。感性に寄り添う、ハイブリッド癒やし設計。
      - paragraph [ref=e144]:
        - text: nemcaroは、聴覚と嗅覚を通じて眠りの質を根本から整えるために、
        - strong [ref=e145]: 音にも香りにも、一切の妥協を許さない設計
        - text: を貫きました。
      - paragraph [ref=e146]:
        - text: 使用するアロマは、
        - strong [ref=e147]: 天然100%の精油のみ
        - text: を厳選。化学合成物質に頼らず、植物本来の力が持つ“深い癒やし”を届けます。
        - text: そしてこの一台で、心を鎮めるサウンドと、深く呼吸を誘う香りが融合し、
        - strong [ref=e148]: 自宅がまるで高級スパのような極上空間に。
      - paragraph [ref=e149]:
        - text: さらに今回、各音源の世界観に合わせて調香した
        - strong [ref=e150]: オリジナルアロマオイル
        - text: を
        - strong [ref=e151]: クラウドファンディング限定で、
        - text: 支援者の皆さまへ特別にプレゼント。
        - text: 新しい“音と香りの体験”を、セットであなたに。
      - paragraph [ref=e152]:
        - link [ref=e153] [cursor=pointer]:
          - /url: https://croix.asia/wp-content/uploads/2025/04/d3e163f9706942cbf8063ccf5f9cd1df.gif
      - paragraph [ref=e154]
      - heading "医学博士 板東 浩 推薦コメント" [level=3] [ref=e155]:
        - text: 
        - strong [ref=e157]: 医学博士 板東 浩 推薦コメント
      - generic [ref=e158]:
        - text: 音楽には、秘めたる力の存在が長年にわたり認識されてきました。
        - text: 私たちが気づかなくても、覚醒や前意識、無意識という各レベルにおいて、パワーを与えてくれているのです。
      - generic [ref=e160]:
        - text: 内科医である私は、ピアニストや音楽療法士としても活動し、音楽を通じて「豊かな人生を送る方法」を伝えています。また様々な場面で、良質な睡眠のために、適切な音楽を選んで活用することを推奨しています。
        - text: 心を癒やす音楽を上手に生活に取り入れると、幸せホルモンがあなたを優しく包み込み、良い遺伝子が活動し始めます。
      - generic [ref=e162]:
        - text: この度「Soundscape」に収録される音楽では、北欧の澄みきった世界観を体験して頂けます。
        - text: 静かに目を閉じて聴いてみてください。nemcaro の立体音響でそのサウンドスケープをより深く感じられ、あなたを健やかな眠りに誘ってくれることでしょう。
        - text: ぐっすり寝ることが(sound sleep)、あなたの良きライフ（毎日、生命、人生）へつながっていくように祈っております。
      - generic [ref=e164]: 「Soundscape」音楽監修： 板東 浩
