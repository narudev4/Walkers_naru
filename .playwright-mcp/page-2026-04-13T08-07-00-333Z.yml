        - strong [ref=e168]: nemcaro(ネムカロ)の立体音響の秘密
      - paragraph [ref=e169]: 大ヒット3Dサラウンドポータブルースピーカー『Cear pavé~シーイヤーパヴェ~』（20年以上にわたる開発経験に裏付けられた特許技術CearFieldを搭載）を生み出した音響のプロフェッショナル、シーイヤー株式会社様に技術協力・監修頂いています。
      - heading "nemcaroプロジェクトに参画できたことを大変嬉しく思います。 試作品での検証を重ねながら、「柔らかな光と香り、癒やしに繋がる珠玉の音源が一体となった空間」を目指し、シーイヤー株式会社は音場制御技術『CearField』の調整を担当いたしました。 非常に心地よく、感動を与えるデバイスが誕生したと感じております。 nemcaroを通して生み出される新しい癒やしの体験を皆様にお届けできれば幸いです。" [level=2] [ref=e170]:
        - generic [ref=e171]:
          - link:
