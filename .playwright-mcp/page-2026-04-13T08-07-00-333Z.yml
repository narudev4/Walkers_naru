      - heading "「眠りが変われば、人生が変わる。」" [level=3] [ref=e61]:
        - text: 
        - strong [ref=e63]: 「眠りが変われば、人生が変わる。」
      - paragraph [ref=e64]:
        - text: 目覚めの重さを、もう当たり前にしない。
        - text: 私たちクロアは、RELAX WORLDブランドとして、2万曲を超える癒やしの音楽を制作してきました。そして今、医学博士・理学博士とともに辿り着いたのが、“
        - strong [ref=e65]: 眠るためだけに設計された音
        - text: ”の世界。α波（※1）を最大限に引き出すサウンドと、心に深く染み込む自然音が、あなたの心身をそっと包み込みます。
      - paragraph [ref=e66]:
        - text: さらにnemcaro (ネムカロ) は、BluetoothもWi-Fiも使わない“
        - strong [ref=e67]: 無接続
        - text: ”の静けさ。
        - text: スマホや通知に邪魔されることなく、音と香りの世界に身を委ねてください。
        - strong [ref=e68]: 眠りが変われば、人生が変わる。
      - paragraph [ref=e69]: (※1)リラックスしているときに優位になる脳波の一種。
      - paragraph [ref=e70]
      - paragraph [ref=e71]:
        - strong [ref=e72]:
          - generic [ref=e73]: nemcaro (ネムカロ) は、
        - text: (1) 特許技術による3D音響システム、
        - text: (2) 天然100％アロマを拡散するディフューザー、
        - text: (3)医学博士等監修の癒やしの音源をUSBメモリーで搭載する、
        - text: 「音」と「香り」で“深睡”空間をつくる、スマホ不要の“眠り専用”デバイス。
      - paragraph [ref=e74]
      - heading "スマホを手放し、“本物の休息”を取り戻す。" [level=3] [ref=e75]:
        - text: 
        - strong [ref=e76]: スマホを手放し、“本物の休息”を取り戻す。
      - paragraph [ref=e77]:
        - text: 眠れない夜を繰り返す日々に、終止符を。
        - text: nemcaroは、
        - strong [ref=e78]: 音と香りの力で“デジタルオフ”の習慣を生み出し、質の高い眠りへと導くウェルネスデバイス
        - text: です。
      - paragraph [ref=e79]:
        - text: 医学博士・理学博士が監修した癒やしのサウンドと、天然100%のアロマが心身を整え、
        - text: スマホを手にしない静かな時間が、あなた本来のリズムを取り戻していきます。
      - paragraph [ref=e80]:
        - text: そして迎える朝。
        - strong [ref=e81]: 「やっと、ぐっすり眠れた」――その実感こそが、nemcaroがもたらす最大の価値です。
        - text: 眠りを変えれば、人生のリズムも変わっていく。まずは、今夜から。
      - paragraph [ref=e82]:
        - img [ref=e83]
      - paragraph [ref=e84]
      - heading "癒やしの音を、ここまで立体的(3D)に感じたことがありますか？" [level=3] [ref=e85]:
        - text: 
        - strong [ref=e87]: 癒やしの音を、ここまで立体的(3D)に感じたことがありますか？
      - paragraph [ref=e88]:
        - text: nemcaroは、科学的研究に基づく癒やしの音楽を、
        - strong [ref=e89]: 特許技術で“眠り専用3Dサウンド”として再構築
        - text: 。
        - text: たった1台とは思えないほど、音が空間を自在に巡り、あなたを優しく包み込みます。まるで耳元から、頭上、背後まで音が“存在する”新しい体験を。
      - paragraph [ref=e90]:
        - link [ref=e91] [cursor=pointer]:
          - /url: https://croix.asia/wp-content/uploads/2025/04/0cf5e93033206a4b699e72a0b63e3e57.gif
      - paragraph [ref=e92]
      - heading "音を“聞く”から、“感じる”へ。五感で没入する新次元の音響体験。" [level=3] [ref=e93]:
        - text: 
        - strong [ref=e94]: 音を“聞く”から、“感じる”へ。五感で没入する新次元の音響体験。
      - paragraph [ref=e95]:
        - text: nemcaroに搭載された立体音響技術は、私たち人間が音の「時間差」「強弱」「周波数変化」から方向や距離を感じ取るメカニズムを応用。
        - text: わずか1台のデバイスから、音が前後左右、上下、全方位に広がり、
        - strong [ref=e96]: 空間そのものが“音の世界”に変わります。
      - paragraph [ref=e97]:
        - text: 思わず “何もない方向” に振り返りたくなるリアルな臨場感。
        - text: 音の位置、奥行き、気配までを感じるような感覚は、もはや「聴く」という行為を超え、
        - strong [ref=e98]: 心と身体で「感じる」音楽体験
        - text: へと進化しています。
      - paragraph [ref=e99]:
        - link [ref=e100] [cursor=pointer]:
          - /url: https://croix.asia/wp-content/uploads/2025/04/d88f58952edb20e76fd78be6f952bdfa.jpg
      - paragraph [ref=e101]
      - heading "深い眠りが、あなたのすべてを整える。" [level=3] [ref=e102]:
        - text: 
        - strong [ref=e103]: 深い眠りが、あなたのすべてを整える。
      - paragraph [ref=e104]: nemcaroは、音を流すだけで空間を一瞬で“癒やしの眠り空間”へと変えるデバイス。
      - paragraph [ref=e105]:
        - text: 収録されたのは、医学博士監修による“澄んだ空気”や“夜空”を感じさせる音風景「Soundscape」。さらに、理学博士監修のもと、話題の
        - strong [ref=e106]: ソルフェジオ周波数528Hz
        - text: に、森・海・スパといった自然の癒やしを重ねた
        - strong [ref=e107]: 3つの特別音源
        - text: 「Forest」「Spa」「Ocean」を新収録。
      - paragraph [ref=e108]:
        - text: これらの音源は、
        - strong [ref=e109]: レム睡眠・ノンレム睡眠の90分周期を超えて
        - text: 、自然音が途切れることなく流れ続ける仕様。
        - text: 眠りの深さと質を整えることで、
        - strong [ref=e110]: 翌朝の集中力・気分・パフォーマンスすら変えていく
        - text: 、目指しているのはそんな“眠りをデザインする音”です。
      - paragraph [ref=e111]:
        - link [ref=e112] [cursor=pointer]:
          - /url: https://croix.asia/wp-content/uploads/2025/04/nemcaro_0305_without-motion_2.gif
      - paragraph [ref=e113]
      - heading "神秘の周波数、528Hz。" [level=3] [ref=e114]:
        - text: 
        - strong [ref=e115]: 神秘の周波数、528Hz。
      - paragraph [ref=e116]: 古代の聖歌「グレゴリオ聖歌」にも使われたとされるソルフェジオ周波数は、数世紀にわたって人の心と身体に働きかけてきた“癒やしの音階”。
      - paragraph [ref=e117]:
        - text: なかでも528Hzは「奇跡の周波数」「愛の周波数」とも呼ばれ、音楽療法の分野でも注目されている特別な音です。
        - text: 交感神経を鎮めて副交感神経を優位にし、
        - strong [ref=e118]: 自律神経の乱れを整える
        - text: ことで、
        - strong [ref=e119]: 心と身体を深いリラックスへ導く
        - text: 作用が期待されています。
      - paragraph [ref=e120]: nemcaroでは、この528Hzをベースにした特別音源を独自制作。ストレスを和らげ、静かに心を整え、あなたに新しい夜を感じて頂きたい、そんな想いで制作しています。
      - paragraph [ref=e121]
      - heading "音の細部に、癒やしの思想を込めて。 こだわりの収録音源" [level=3] [ref=e122]:
        - text: 
        - strong [ref=e123]: 音の細部に、癒やしの思想を込めて。
        - strong [ref=e124]: こだわりの収録音源
