      - heading "その名に込めたのは、“眠り”への愛。" [level=3] [ref=e178]:
        - text: 
        - strong [ref=e179]: その名に込めたのは、“眠り”への愛。
      - paragraph [ref=e180]:
        - text: nemcaro（ネムカロ）という名前には、深い願いと想いが込められています。
        - text: 九州地方の方言「眠かろ（＝眠たいでしょう）」をヒントに、「nemuri（眠り）」の響きをベースに命名。
      - paragraph [ref=e181]:
        - text: さらに、Nature（自然）／Emotion（感情）／Mind（心）の頭文字を内包し、
        - strong [ref=e182]: caro
        - text: はイタリア語で「愛しい」「大切な」という意味を持つ言葉。
      - paragraph [ref=e183]:
        - text: 心・感情・自然に寄り添い、大切な人や自分自身を“愛する眠り”を届けたい。
        - text: nemcaroという名には、そんな想いが重なり合っています。
        - text: ただ眠るだけじゃない、
        - strong [ref=e184]: 人生を癒やす“体験”としての眠り
        - text: を、あなたへ。
      - paragraph [ref=e185]:
        - img [ref=e186]
      - paragraph [ref=e187]
      - heading "オプション：眠りの為の関連商品" [level=3] [ref=e188]:
        - text: 
        - strong [ref=e189]: オプション：眠りの為の関連商品
      - heading "nemcaroロゴ入り・プレミアムアイマスク" [level=2] [ref=e190]:
        - strong [ref=e192]: nemcaroロゴ入り・プレミアムアイマスク
      - paragraph [ref=e193]:
        - text: 眠りの時間を、さらにひとつ上のステージへ。
        - text: このオリジナルアイマスクは、
        - strong [ref=e194]: 目元にぴたりと寄り添うフィット感
        - text: で、外部の光をしっかり遮断。
        - text: 静かな暗闇が、より深い眠りへの入口をつくることを目指しています。
      - paragraph [ref=e195]:
        - text: 生地には、
        - strong [ref=e196]: 特殊な天然鉱物とバイオフォトニクス技術を融合させた繊維
        - text: を採用。
        - text: 体温を活用して
        - strong [ref=e197]: 遠赤外線エネルギー
        - text: を発生させ、
        - strong [ref=e198]: 目元をじんわり温める
        - text: ことでリラックスタイムをより充実したものに導きます。
      - paragraph [ref=e199]:
        - strong [ref=e200]: nemcaroとの併用で、音・香り・肌感覚の“トリプル癒やし”
        - text: 環境が完成。
        - text: よく眠って1日を心地よく始めたい、そんなあなたにオススメしたい
        - strong [ref=e201]: 特別仕様のアイマスク
        - text: です。
      - paragraph [ref=e202]
      - heading "注目の繊維の中のテクノロジー。" [level=2] [ref=e203]:
        - strong [ref=e205]: 注目の繊維の中のテクノロジー。
      - paragraph [ref=e206]: INFRACYCLE®（インフラサイクル）は、アメリカ・LOW IMPACT社が開発した最先端の機能性素材。 赤外線を発する天然鉱物と、バイオフォトニクス技術による高機能粒子を繊維に練り込み、まるで“呼吸するように”働く特別なファブリックです。
      - paragraph [ref=e207]: この素材は、私たちの身体から自然に放たれる赤外線エネルギーをキャッチし、増幅して再照射。 まるで身体に寄り添うようにじんわりと深部から温めることで、緊張をほぐすお手伝いを致します。
      - paragraph [ref=e208]: nemcaroアイマスクをあなたの眠りの進化に是非お役立てください。
      - paragraph [ref=e209]
      - paragraph [ref=e210]: ※デザインは開発中のものです。画像の色は実際の製品と異なる場合があります。
