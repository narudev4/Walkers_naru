      - heading "AI生成による瞑想音楽サービス「itakeru.com」正式オープン：リアルタイムで心身の調和を促す新体験" [level=1] [ref=e23]
      - generic [ref=e24]:
        - generic [ref=e25]:
          - img [ref=e26]
          - paragraph [ref=e27]: itakeru.com
        - paragraph [ref=e28]:
          - strong [ref=e30]: クロアが最新AI技術で提供する個別最適化された瞑想音楽、内なる宇宙との深いつながりをサポート
        - paragraph [ref=e31]: ウェルビーイング・テクノロジー事業を行なう株式会社クロアは、AIが生成する瞑想音楽をリアルタイムで提供するウェブサイト「itakeru.com」を、２０２４年１１月５日に正式オープンしました。本サイトは、ユーザーの心の状態に合わせてAIが無限に音楽を生成し、瞑想やビジュアライゼーションをサポートします。
        - paragraph [ref=e32]: 「itakeru.com」は、ユーザー一人ひとりに適応した音楽体験を通じて、深い自己探求の旅を可能にします。スマートフォンやPCなど様々なデバイスからアクセス可能で、シンプルな操作性により、誰でも直感的に瞑想を楽しむことができます。自然音や環境音を取り入れる機能も備え、心と体を穏やかな状態へと導きます。
        - paragraph [ref=e33]: サイト名「五十猛(itakeru)」は、日本神話に登場する自然と調和を象徴する神「五十猛命（いたけるのみこと）」に由来します。AI生成の音楽を通じ、ユーザーが内なる自然とつながり、心の豊かさを育むことを目指しています。クロアは今後、ユーザーのフィードバックをもとにさらなるパーソナライズ機能や他のウェルネスサービスとの連携を進め、心の健康促進に貢献していきます。
        - paragraph [ref=e34]:
          - text: 詳細は公式サイト（
          - link "https://itakeru.com/" [ref=e35] [cursor=pointer]:
            - /url: https://itakeru.com/
          - text: ）をご覧ください。
        - paragraph [ref=e36]
