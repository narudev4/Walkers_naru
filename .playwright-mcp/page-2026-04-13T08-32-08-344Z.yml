        - paragraph [ref=e117]: といった資産を基盤に、睡眠や瞑想、集中、ストレスケアなどの分野で事業を展開しています。世界的に Wellbeing × Sound の市場は拡大しており、特に デジタル音楽 × 健康領域 は今後大きな成長が期待されています。
        - paragraph [ref=e118]: 睡眠ウェルネスブランド「nemcaro」は、こうした事業基盤から生まれました。今回のアパレル事業は、立体音響デバイスを起点とした睡眠ソリューションをさらに拡張するもので、デバイス・コンテンツ・サービスと並ぶ重要な柱として今後国内外へ展開していく予定です。
