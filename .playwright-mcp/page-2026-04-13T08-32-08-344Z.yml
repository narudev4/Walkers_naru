      - heading "ウェルビーイング企業クロア、元・東京スタイル代表ら参画の睡眠ブランド「nemcaro」アパレルチーム発足" [level=1] [ref=e23]
      - generic [ref=e24]:
        - heading "東京スタイル出身の中核メンバーが集結“眠りのためのスリープウェア”開発プロジェクト始動" [level=2] [ref=e25]
        - paragraph [ref=e26]
        - paragraph [ref=e27]:
          - strong [ref=e29]: 睡眠を“着る”という新しいウェルネス体験へ。
        - paragraph [ref=e30]: ウェルビーイング・テクノロジー事業を展開する株式会社クロア（本社：東京都目黒区、代表取締役社長：戸部田 馬準）は、睡眠ウェルネスブランド「nemcaro（ネムカロ）」のアパレル事業強化のため、専門チームを発足しました。本チームには、株式会社東京スタイル（現TSIホールディングス）の元代表取締役社長 山田康夫氏 を顧問に迎え、同社出身のMD・デザイナーなど経験豊富なメンバーが参画。機能性素材とファッションデザインを融合した “眠りのためのスリープウェア” の開発を本格的にスタートします。
        - paragraph [ref=e31]
        - heading "■ nemcaroの原点" [level=2] [ref=e32]
        - paragraph [ref=e33]:
          - strong [ref=e34]: 音から始まった睡眠ウェルネスブランド
        - figure [ref=e36]:
          - img [ref=e37]
        - paragraph [ref=e38]: nemcaroは、クロアが長年培ってきたウェルビーイング事業の知見をもとに誕生した睡眠ウェルネスブランドです。クロアはこれまで、ヒーリング音楽や自然映像などのコンテンツ制作を通じて、瞑想・睡眠・リラクゼーション領域のデジタルコンテンツを世界に向けて提供してきました。その技術と知見を融合し、2025年には 立体音響による睡眠体験を提供するデバイスを発表。クラウドファンディングでは目標の400％を超える支持を獲得し、2026年3月29日には一般発売を予定しています。
        - paragraph [ref=e39]:
          - strong [ref=e40]: nemcaroは
        - paragraph [ref=e41]:
          - strong [ref=e42]:
            - text: 音
            - text: 映像
            - text: 香り
            - text: 素材
        - paragraph [ref=e43]: を融合し、都市生活者の睡眠環境をトータルで再設計するブランドとして展開しています。
        - paragraph [ref=e44]:
