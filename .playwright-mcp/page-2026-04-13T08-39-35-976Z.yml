    - listitem [ref=e49]: 「眠れる森の美女」をコンセプトにした美容鍼サロン「Relaxest(リラクゼスト)」、2025年3月22日に東京・恵比寿にて新規オープン
  - article [ref=e50]:
    - generic [ref=e52]:
      - paragraph [ref=e53]: ウェルビーイング・テクノロジー事業を展開する株式会社クロアは、まるで「眠れる森の美女」の物語のように、心と身体が目覚めるようなひとときを提供する美容鍼サロン「Relaxest」を、2025年3月22日に東京都渋谷区恵比寿南1丁目(恵比寿駅徒歩約5分)に新たにオープンいたします。
      - paragraph [ref=e54]: 当サロンではこだわりのメニューで眠りと美しさを引き出す美容鍼施術をご提供。さらに、施術ルームに広がる音と香りにもこだわり、五感すべてで深くリラックスいただける極上の癒やし体験をお届けします。
      - generic [ref=e55]:
        - link [ref=e56] [cursor=pointer]:
          - /url: https://croix.asia/wp-content/uploads/2025/03/0031_240311_2-scaled.jpeg
          - img [ref=e57]
        - paragraph [ref=e58]: 「Relaxest」店舗受付
      - paragraph [ref=e59]
      - paragraph [ref=e60]:
        - strong [ref=e62]: ■サロンの特徴
      - paragraph [ref=e63]:
        - strong [ref=e64]: ●内側・外側から美しさを引き出す
        - text: 美容鍼によるリフトアップ効果や肌トーンアップを促し、外見だけでなく、心の安らぎも手に入れることができます。
      - paragraph [ref=e65]:
        - strong [ref=e66]: ●眠りの質を高める美容鍼
        - text: 「眠れる森の美女」の世界観を感じる空間で、美容鍼を通じて自律神経を整え、深い眠りとともに心身のリフレッシュを促進します。鍼を使った施術は、眠りの質向上を目指し、日々のストレスや疲労を解消します。
      - paragraph [ref=e67]:
        - strong [ref=e68]: ●異なる個室のテーマ
        - text: サロン内には4つの個室があり、ルーム名は「Rose」「Aurora」「Forest」「Bliss」と各異なるテーマのお部屋となっております。
      - paragraph [ref=e69]:
        - strong [ref=e70]: ●美容鍼の専門施術
        - text: 高い技術を持つ鍼灸師が一人ひとりに合わせた美容鍼施術を行い、顔のむくみ、リフトアップ、血行促進、肌質改善など、さまざまなお悩みに対応します。
      - paragraph:
        - link "サロン内4つの個室":
          - /url: https://croix.asia/wp-content/uploads/2025/03/0045_240311-room_image-scaled.jpeg
          - img "サロン内4つの個室" [ref=e71] [cursor=pointer]
      - paragraph [ref=e72]
      - paragraph [ref=e73]:
        - strong [ref=e75]: すみれさんからのコメントが届いています！
      - paragraph [ref=e76]:
        - text: 3/10(月)に配信リリースとなりました新曲「Relaxest（リラクゼスト）」、聞いてもらえたかな？
        - text: 私がイメージキャラクターをやらせていただく東京・恵比寿にオープンする、音楽と美容が一体となった新しい美容鍼サロン『Relaxest』のために作られた楽曲です。
        - text: 「眠れる森の美女」をテーマにしたサロンで、私もオープンを楽しみにしていました。
        - text: 小顔や美肌だけでなく肩こりや自律神経調整のコースやお得なコースもあるみたいなので、ぜひ行ってみてください！
