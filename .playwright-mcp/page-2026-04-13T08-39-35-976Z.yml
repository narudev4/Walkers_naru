      - paragraph [ref=e101]: 2025年3月10日より Apple Music、Amazon Music、Spotifyほか各配信サイトにて配信開始 となりました。また、JOYSOUNDでのカラオケ配信も同日スタート。すみれが主演する美容鍼サロン『Relaxest（リラクゼスト）』のコンセプトムービーの映像をバックにカラオケを楽しめます。
      - paragraph [ref=e102]: 新曲『Relaxest』で、すみれの透明感あふれる歌声とともに、心地よいリラクゼーションの世界をお楽しみください。Apple Music、Amazon Musicにて、話題の立体音響ドルビーアトモスでお楽しみいただけます。
