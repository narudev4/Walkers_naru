      - heading "美容鍼サロン『Relaxest』のイメージキャラクターに「すみれ」を迎え、オリジナル楽曲『Relaxest』を歌い上げるコンセプトムービーを公開！" [level=1] [ref=e23]
      - generic [ref=e24]:
        - generic [ref=e25]:
          - img [ref=e26]
          - paragraph [ref=e27]: 『Relaxest』のイメージキャラクター「すみれ」
        - heading "「すみれ」が奏でる至高の癒やしと美 – 極上の香りと音に包まれるラグジュアリーな美容体験" [level=3] [ref=e28]:
          - strong [ref=e29]: 「すみれ」が奏でる至高の癒やしと美 – 極上の香りと音に包まれるラグジュアリーな美容体験
        - paragraph [ref=e30]: ウェルビーイング・テクノロジー事業を展開する株式会社クロアは、2025年2月、東京・恵比寿に新規オープン予定の美容鍼サロン『Relaxest（リラクゼスト）』のイメージキャラクターに、女優で歌手の「すみれ」を起用しました。この起用を記念し、ブルーノ・マーズやTWICEなどの楽曲提供やプロデュースを手掛けたトラックメーカーチームが制作したオリジナル楽曲『Relaxest』を「すみれ」が歌唱し、主演として出演するサロンのコンセプトムービーを公開致しました。
        - paragraph [ref=e31]
        - paragraph [ref=e32]:
          - strong [ref=e33]: 透明感あふれる美しさが映し出すサロンの魅力
        - paragraph [ref=e34]: 今回公開されたコンセプトムービーでは、「すみれ」が持つ透明感と洗練された美しさが、サロンの世界観を鮮やかに映し出しています。バックグラウンドで流れる楽曲『Relaxest』は、心地よいリラクゼーションを誘うメロディと繊細なアレンジが特徴で、サロンのブランドメッセージを優美に描き出しています。
        - paragraph [ref=e35]
        - paragraph [ref=e36]:
          - strong [ref=e37]: 白を基調とした洗練された空間で心身をリフレッシュ
        - paragraph [ref=e38]: 『Relaxest』は、現代人の美と健康を総合的にサポートするため、「眠れる森の美女」をテーマに掲げ、極上の癒しと美を追求した美容鍼サロンです。白を基調とした高級感あふれる内装に加え、国家資格を持つ施術者によるオーダーメイド施術を通じて、心身をリフレッシュする特別な空間を提供します。
        - paragraph [ref=e39]
        - paragraph [ref=e40]:
          - strong [ref=e41]: 「心と体の美しさ」を届ける独自の癒やし体験
        - paragraph [ref=e42]: 『Relaxest』は、東洋医学、音、香りを巧みに融合させた独自のリラクゼーション体験を通じて、訪れるすべての方に「心と体の美しさ」をお届けすることを目指しています。すみれさんをイメージキャラクターに迎え、ラグジュアリーな空間と最先端の美容鍼技術を組み合わせ、多くの方々に新しい美と健康のライフスタイルを提案してまいります。
        - generic [ref=e43]:
          - img [ref=e44]
          - paragraph [ref=e45]: SUMIRE / Relaxest
