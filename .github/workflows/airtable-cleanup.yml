name: Airtable Periodic Cleanup
on:
  schedule:
    - cron: '0 18 */2 * *'   # 2日に1回 03:00 JST (18:00 UTC)
  workflow_dispatch:           # 手動実行も可能

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 03_projects/1LC/auto_archive/auto_delete.py --delete --yes
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          BACKUP_SHEET_WEBHOOK: ${{ secrets.BACKUP_SHEET_WEBHOOK }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_id }}
          path: 03_projects/1LC/auto_archive/logs/
          retention-days: 90

  notify-failure:
    needs: cleanup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification to Chatwork
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          if [ -z "$CHATWORK_TOKEN" ] || [ -z "$CHATWORK_ROOM_ID" ]; then
            echo "::warning::CHATWORK_TOKEN or CHATWORK_ROOM_ID not set — skipping notification"
            exit 0
          fi
          curl -s -X POST \
            -H "X-ChatWorkToken: ${CHATWORK_TOKEN}" \
            -d "body=[info][title]Airtable定期削除 失敗[/title]GitHub Actions の定期削除が失敗しました。%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}[/info]" \
            "https://api.chatwork.com/v2/rooms/${CHATWORK_ROOM_ID}/messages"
