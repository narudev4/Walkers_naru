name: Airtable Periodic Cleanup
on:
  schedule:
    - cron: '0 18 */2 * *'   # 2日に1回 03:00 JST (18:00 UTC)
  workflow_dispatch:           # 手動実行も可能

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 03_projects/1LC/auto_archive/auto_delete.py --delete --yes
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          BACKUP_SHEET_WEBHOOK: ${{ secrets.BACKUP_SHEET_WEBHOOK }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_id }}
          path: 03_projects/1LC/auto_archive/logs/
          retention-days: 90

