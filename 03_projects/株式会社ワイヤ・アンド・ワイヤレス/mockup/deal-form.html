<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規商談作成 - Wi2 Sales</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .breadcrumb a:hover {
      color: var(--primary);
    }
    .breadcrumb-sep {
      color: var(--text-muted);
      font-size: 12px;
    }
    .breadcrumb-current {
      color: var(--text);
      font-weight: 500;
    }

    .form-section {
      margin-bottom: 32px;
    }
    .form-section:last-child {
      margin-bottom: 0;
    }
    .form-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      padding-bottom: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-section-title .section-icon {
      width: 18px;
      height: 18px;
      color: var(--primary);
    }

    .input-with-prefix {
      position: relative;
      display: flex;
      align-items: stretch;
    }
    .input-prefix {
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: var(--radius) 0 0 var(--radius);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .input-with-prefix .form-input {
      border-radius: 0 var(--radius) var(--radius) 0;
      flex: 1;
    }

    .input-with-suffix {
      position: relative;
      display: flex;
      align-items: stretch;
    }
    .input-suffix {
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .input-with-suffix .form-input {
      border-radius: var(--radius) 0 0 var(--radius);
      flex: 1;
    }

    .input-with-prefix-suffix {
      position: relative;
      display: flex;
      align-items: stretch;
    }
    .input-with-prefix-suffix .input-prefix {
      border-right: none;
      border-radius: var(--radius) 0 0 var(--radius);
    }
    .input-with-prefix-suffix .form-input {
      border-radius: 0;
      flex: 1;
    }
    .input-with-prefix-suffix .input-suffix {
      border-left: none;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .auto-calc {
      background: var(--info-bg) !important;
      color: var(--text);
    }
    .auto-calc:focus {
      border-color: var(--info) !important;
      box-shadow: 0 0 0 3px rgba(2,132,199,0.1) !important;
    }

    .search-field {
      position: relative;
    }
    .search-field .form-input {
      padding-left: 36px;
    }
    .search-field svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Equipment table */
    .equipment-table {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .equipment-table th {
      background: var(--bg);
      font-size: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .equipment-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }
    .equipment-table tr:last-child td {
      border-bottom: none;
    }
    .equipment-table .form-input {
      padding: 6px 10px;
      font-size: 13px;
      width: 100%;
    }
    .equipment-table input[type="number"] {
      width: 80px;
    }
    .btn-delete-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      color: var(--text-muted);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-delete-row:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .btn-add-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
      transition: opacity var(--transition);
    }
    .btn-add-row:hover {
      opacity: 0.7;
    }

    .form-input.invalid {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
    }

    .toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--text);
      color: var(--card);
      padding: 14px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9999;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 100;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .autocomplete-list.show {
      display: block;
    }
    .autocomplete-item {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--text);
    }
    .autocomplete-item:hover,
    .autocomplete-item.selected {
      background: var(--primary-light);
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>Wi2 Sales</h1>
      <span>営業管理システム</span>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-label">メニュー</div>
        <a href="dashboard.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5.5" height="5.5" rx="1"/><rect x="10.5" y="2" width="5.5" height="5.5" rx="1"/><rect x="2" y="10.5" width="5.5" height="5.5" rx="1"/><rect x="10.5" y="10.5" width="5.5" height="5.5" rx="1"/></svg>
          ダッシュボード
        </a>
        <a href="deals-list.html" class="sidebar-link active">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h12v12H3z"/><path d="M3 7h12"/><path d="M7 3v12"/></svg>
          商談管理
        </a>
        <a href="accounts.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15s1.5-2 4-2 4 2 4 2"/><circle cx="6" cy="7" r="2.5"/><path d="M12.5 7.5a2 2 0 1 1 0-4"/><path d="M14 13c1.5 0 2.5-1 2.5-1"/></svg>
          取引先
        </a>
        <a href="contacts.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="3"/><path d="M3 16s1.5-4 6-4 6 4 6 4"/></svg>
          担当者
        </a>
        <a href="ap-management.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9a3.5 3.5 0 0 1 7 0"/><path d="M3 9a6 6 0 0 1 12 0"/><circle cx="9" cy="9" r="1"/><path d="M9 10v5"/></svg>
          AP管理
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">分析</div>
        <a href="reports.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14V8"/><path d="M9 14V4"/><path d="M14 14v-4"/></svg>
          レポート
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">システム</div>
        <a href="settings.html" class="sidebar-link">
          <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.4 3.4l1.4 1.4M13.2 13.2l1.4 1.4M3.4 14.6l1.4-1.4M13.2 4.8l1.4-1.4"/></svg>
          設定
        </a>
      </div>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-avatar">田</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">田中太郎</div>
        <div class="sidebar-user-dept">第一営業本部</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Header -->
    <div class="header">
      <div class="breadcrumb">
        <a href="deals-list.html">商談管理</a>
        <span class="breadcrumb-sep">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 2.5l3.5 3.5-3.5 3.5"/></svg>
        </span>
        <span class="breadcrumb-current">新規商談作成</span>
      </div>
      <div class="header-actions">
        <a href="deals-list.html" class="btn btn-outline">キャンセル</a>
        <button type="submit" form="deal-form" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 1H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4l-3-3z"/><path d="M8 1v3h3"/><path d="M5 8h4"/><path d="M5 10.5h4"/></svg>
          保存
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="card">
        <div class="card-body" style="padding: 28px 32px;">
          <form id="deal-form">

            <!-- 基本情報 -->
            <div class="form-section">
              <div class="form-section-title">
                <svg class="section-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7.5"/><path d="M9 5.5v4"/><circle cx="9" cy="12.5" r="0.5" fill="currentColor"/></svg>
                基本情報
              </div>
              <div class="form-grid">
                <div class="form-group full">
                  <label class="form-label">商談名<span class="required">*</span></label>
                  <input type="text" class="form-input" placeholder="例: ○○チェーン Wi-Fi導入プロジェクト" required>
                </div>
                <div class="form-group">
                  <label class="form-label">取引先<span class="required">*</span></label>
                  <div class="search-field" style="position: relative;">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>
                    <input type="text" id="account-search" class="form-input" placeholder="取引先を検索..." required style="width: 100%;" autocomplete="off">
                    <div class="autocomplete-list" id="autocomplete-list"></div>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">フェーズ</label>
                  <select class="form-input">
                    <option value="lead">リード</option>
                    <option value="proposal">提案中</option>
                    <option value="estimate">見積提出</option>
                    <option value="negotiation">交渉中</option>
                    <option value="won">受注</option>
                    <option value="lost">失注</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">受注確度</label>
                  <select class="form-input">
                    <option value="10">10%</option>
                    <option value="30">30%</option>
                    <option value="50" selected>50%</option>
                    <option value="70">70%</option>
                    <option value="90">90%</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">担当者</label>
                  <select class="form-input">
                    <option value="tanaka" selected>田中太郎</option>
                    <option value="sato">佐藤花子</option>
                    <option value="suzuki">鈴木一郎</option>
                    <option value="yamada">山田健太</option>
                    <option value="takahashi">高橋美咲</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">営業本部</label>
                  <select class="form-input">
                    <option value="div1" selected>第一営業本部</option>
                    <option value="div2">第二営業本部</option>
                    <option value="div3">第三営業本部</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">受注予定日</label>
                  <input type="date" class="form-input">
                </div>
              </div>
            </div>

            <!-- 収益情報 -->
            <div class="form-section">
              <div class="form-section-title">
                <svg class="section-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5v15"/><path d="M13 4.5H7.5a2.5 2.5 0 0 0 0 5H11a2.5 2.5 0 0 1 0 5H5"/></svg>
                収益情報
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">構築費（初期費用）</label>
                  <div class="input-with-prefix">
                    <span class="input-prefix">&yen;</span>
                    <input type="text" id="construction-cost" class="form-input" placeholder="3,200,000" inputmode="numeric">
                  </div>
                  <span class="form-hint">機器設置・ネットワーク構築等の一括費用</span>
                </div>
                <div class="form-group">
                  <label class="form-label">月額サブスク</label>
                  <div class="input-with-prefix-suffix">
                    <span class="input-prefix">&yen;</span>
                    <input type="text" id="monthly-fee" class="form-input" placeholder="180,000" inputmode="numeric">
                    <span class="input-suffix">/月</span>
                  </div>
                  <span class="form-hint">運用・保守の月額費用</span>
                </div>
                <div class="form-group full">
                  <label class="form-label">計上額（年間）</label>
                  <div class="input-with-prefix">
                    <span class="input-prefix">&yen;</span>
                    <input type="text" id="annual-amount" class="form-input auto-calc" placeholder="自動計算" readonly>
                  </div>
                  <span class="form-hint">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="vertical-align: -2px; margin-right: 2px;"><circle cx="7" cy="7" r="5.5"/><path d="M7 4.5V7l2 1.5"/></svg>
                    構築費 + 月額 &times; 12ヶ月 で自動計算されます
                  </span>
                </div>
              </div>
            </div>

            <!-- 納品情報 -->
            <div class="form-section">
              <div class="form-section-title">
                <svg class="section-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="11" rx="1.5"/><path d="M5.5 4V2.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1V4"/><path d="M2 8.5h14"/></svg>
                納品情報
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">納品予定日</label>
                  <input type="date" class="form-input">
                </div>
                <div class="form-group full">
                  <label class="form-label">納品フェーズ</label>
                  <textarea class="form-input" placeholder="例: Phase1: 100台（10月）、Phase2: 200台（1月）" rows="3"></textarea>
                  <span class="form-hint">段階的な納品計画がある場合に記載してください</span>
                </div>
              </div>
            </div>

            <!-- 関連機器 -->
            <div class="form-section">
              <div class="form-section-title">
                <svg class="section-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9a3.5 3.5 0 0 1 7 0"/><path d="M3 9a6 6 0 0 1 12 0"/><circle cx="9" cy="9" r="1"/><path d="M9 10v5"/></svg>
                関連機器
              </div>
              <table class="equipment-table" id="equipment-table">
                <thead>
                  <tr>
                    <th style="width: 40%;">機種名</th>
                    <th style="width: 15%;">数量</th>
                    <th style="width: 35%;">備考</th>
                    <th style="width: 10%;"></th>
                  </tr>
                </thead>
                <tbody id="equipment-body">
                  <tr>
                    <td><input type="text" class="form-input" placeholder="例: Cisco Catalyst 9120AXI"></td>
                    <td><input type="number" class="form-input" placeholder="0" min="0"></td>
                    <td><input type="text" class="form-input" placeholder="備考"></td>
                    <td style="text-align: center;">
                      <button type="button" class="btn-delete-row" onclick="deleteEquipmentRow(this)" title="削除">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 3.5h9"/><path d="M5 3.5V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/><path d="M10.5 3.5v8a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-8"/><path d="M6 6v4"/><path d="M8 6v4"/></svg>
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td><input type="text" class="form-input" placeholder="例: Meraki MR56"></td>
                    <td><input type="number" class="form-input" placeholder="0" min="0"></td>
                    <td><input type="text" class="form-input" placeholder="備考"></td>
                    <td style="text-align: center;">
                      <button type="button" class="btn-delete-row" onclick="deleteEquipmentRow(this)" title="削除">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 3.5h9"/><path d="M5 3.5V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/><path d="M10.5 3.5v8a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-8"/><path d="M6 6v4"/><path d="M8 6v4"/></svg>
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td><input type="text" class="form-input" placeholder="例: PoEスイッチ"></td>
                    <td><input type="number" class="form-input" placeholder="0" min="0"></td>
                    <td><input type="text" class="form-input" placeholder="備考"></td>
                    <td style="text-align: center;">
                      <button type="button" class="btn-delete-row" onclick="deleteEquipmentRow(this)" title="削除">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 3.5h9"/><path d="M5 3.5V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/><path d="M10.5 3.5v8a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-8"/><path d="M6 6v4"/><path d="M8 6v4"/></svg>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <button type="button" class="btn-add-row" onclick="addEquipmentRow()">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg>
                機器を追加
              </button>
            </div>

            <!-- 備考 -->
            <div class="form-section">
              <div class="form-section-title">
                <svg class="section-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h12v12H3z" rx="1.5"/><path d="M6 7h6"/><path d="M6 10h4"/></svg>
                備考
              </div>
              <div class="form-group full">
                <textarea class="form-input" placeholder="社内共有メモや特記事項を記載" rows="4"></textarea>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  var constructionInput = document.getElementById('construction-cost');
  var monthlyInput = document.getElementById('monthly-fee');
  var annualOutput = document.getElementById('annual-amount');

  function parseNumber(str) {
    if (!str) return 0;
    return parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
  }

  function formatNumber(num) {
    if (num === 0) return '';
    return num.toLocaleString('ja-JP');
  }

  function formatOnBlur(input) {
    var val = parseNumber(input.value);
    if (val > 0) input.value = formatNumber(val);
  }

  function calcAnnual() {
    var construction = parseNumber(constructionInput.value);
    var monthly = parseNumber(monthlyInput.value);
    var annual = construction + monthly * 12;
    annualOutput.value = annual > 0 ? formatNumber(annual) : '';
  }

  constructionInput.addEventListener('input', calcAnnual);
  monthlyInput.addEventListener('input', calcAnnual);
  constructionInput.addEventListener('blur', function() { formatOnBlur(this); });
  monthlyInput.addEventListener('blur', function() { formatOnBlur(this); });

  function addEquipmentRow() {
    var tbody = document.getElementById('equipment-body');
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><input type="text" class="form-input" placeholder="機種名を入力"></td>' +
      '<td><input type="number" class="form-input" placeholder="0" min="0"></td>' +
      '<td><input type="text" class="form-input" placeholder="備考"></td>' +
      '<td style="text-align: center;">' +
        '<button type="button" class="btn-delete-row" onclick="deleteEquipmentRow(this)" title="削除">' +
          '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 3.5h9"/><path d="M5 3.5V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/><path d="M10.5 3.5v8a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-8"/><path d="M6 6v4"/><path d="M8 6v4"/></svg>' +
        '</button>' +
      '</td>';
    tbody.appendChild(tr);
  }

  function deleteEquipmentRow(btn) {
    var tbody = document.getElementById('equipment-body');
    if (tbody.rows.length <= 1) return;
    btn.closest('tr').remove();
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  document.querySelectorAll('.form-input[required]').forEach(function(input) {
    input.addEventListener('blur', function() {
      if (!this.value.trim()) {
        this.classList.add('invalid');
      } else {
        this.classList.remove('invalid');
      }
    });
    input.addEventListener('input', function() {
      if (this.value.trim()) this.classList.remove('invalid');
    });
  });

  document.getElementById('deal-form').addEventListener('submit', function(e) {
    e.preventDefault();
    showToast('保存しました');
    setTimeout(function() { window.location.href = 'deal-detail.html'; }, 1000);
  });

  document.querySelector('a.btn.btn-outline[href="deals-list.html"]').addEventListener('click', function(e) {
    e.preventDefault();
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'deals-list.html';
    }
  });

  var accounts = [
    '横浜市交通局', '渋谷区役所', 'マツモトキヨシ', 'タリーズコーヒー',
    '成田国際空港', '東京メトロ', 'JR東海', 'ドトールコーヒー',
    'ファミリーマート', 'ローソン', 'セブン-イレブン', '大阪市交通局',
    '名古屋市営地下鉄', 'スターバックス', 'イオンモール'
  ];

  var searchInput = document.getElementById('account-search');
  var listEl = document.getElementById('autocomplete-list');
  var selectedIdx = -1;

  searchInput.addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    listEl.innerHTML = '';
    selectedIdx = -1;
    if (!q) { listEl.classList.remove('show'); return; }
    var matches = accounts.filter(function(a) { return a.toLowerCase().indexOf(q) !== -1; });
    if (matches.length === 0) { listEl.classList.remove('show'); return; }
    matches.forEach(function(m) {
      var div = document.createElement('div');
      div.className = 'autocomplete-item';
      div.textContent = m;
      div.addEventListener('mousedown', function(e) {
        e.preventDefault();
        searchInput.value = m;
        listEl.classList.remove('show');
        searchInput.classList.remove('invalid');
      });
      listEl.appendChild(div);
    });
    listEl.classList.add('show');
  });

  searchInput.addEventListener('keydown', function(e) {
    var items = listEl.querySelectorAll('.autocomplete-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
      items.forEach(function(it, i) { it.classList.toggle('selected', i === selectedIdx); });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = Math.max(selectedIdx - 1, 0);
      items.forEach(function(it, i) { it.classList.toggle('selected', i === selectedIdx); });
    } else if (e.key === 'Enter' && selectedIdx >= 0) {
      e.preventDefault();
      searchInput.value = items[selectedIdx].textContent;
      listEl.classList.remove('show');
      searchInput.classList.remove('invalid');
    }
  });

  searchInput.addEventListener('blur', function() {
    setTimeout(function() { listEl.classList.remove('show'); }, 150);
  });
</script>

<script src="responsive.js"></script>
</body>
</html>
